/* ── URL CONVERTERS ── */
function extractDriveId(url){
  if(!url)return null;
  for(const p of[/\/file\/d\/([a-zA-Z0-9_-]{20,})/,/id=([a-zA-Z0-9_-]{20,})/,/\/d\/([a-zA-Z0-9_-]{20,})\//]){
    const m=url.match(p);if(m)return m[1];
  }
  return null;
}
function toImgUrl(url){
  if(!url)return'';
  if(!url.includes('drive.google.com'))return url;
  const id=extractDriveId(url);
  return id?`https://lh3.googleusercontent.com/d/${id}`:url;
}
function toBrochureUrls(url){
  if(!url)return{open:null,download:null};
  if(!url.includes('drive.google.com'))return{open:url,download:url};
  const id=extractDriveId(url);
  if(id)return{open:`https://drive.google.com/file/d/${id}/preview`,download:`https://drive.google.com/uc?export=download&id=${id}`};
  return{open:url,download:url};
}

/* ── SAFE IMAGE ── */
function SafeImg({src,alt,style,fit}){
  const cv=toImgUrl(src);
  const [s,setS]=useState('idle');
  useEffect(()=>{setS(cv?'loading':'idle');},[cv]);
  if(!cv||s==='error'){
    return(
      <div style={{...style,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,background:"linear-gradient(135deg,#f0ebe0,#e8dfc8)",border:"1.5px dashed rgba(196,144,30,.4)"}}>
        <I.ImgPh/><span style={{fontSize:9.5,color:"#9A7A40",textAlign:"center",padding:"0 8px",lineHeight:1.4}}>{src?"Image not loading":"Add image via Admin"}</span>
      </div>
    );
  }
  return(
    <div style={{...style,position:"relative",overflow:"hidden",background:"#f0ebe0"}}>
      {s!=='loaded'&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"#f0ebe0"}}><I.ImgPh/></div>}
      <img src={cv} alt={alt||""} style={{width:"100%",height:"100%",objectFit:fit||"cover",display:"block",opacity:s==='loaded'?1:0,transition:"opacity .3s"}}
        draggable={false} onContextMenu={e=>e.preventDefault()}
        onLoad={()=>setS('loaded')} onError={()=>setS('error')}/>
    </div>
  );
}

      <input className="ain" type="url" value={value} onChange={e=>{onChange(e.target.value);setErr(false);}} placeholder="Image URL or Google Drive share link"/>
      {isDrive&&!err&&<div style={{background:"#E8F5E9",border:"1px solid #A5D6A7",borderRadius:4,padding:"4px 9px",marginTop:5,fontSize:11,color:"#2E7D32"}}>✓ Google Drive link — auto-converted!</div>}
      {cv&&<div style={{marginTop:6,borderRadius:4,overflow:"hidden",height:60,position:"relative",background:"#f0ebe0",border:"1px solid #eee"}}>
        <img src={cv} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}
          onError={e=>{setErr(true);e.target.style.display="none";}}
          onLoad={e=>{setErr(false);e.target.style.display="block";}}/>
        {err&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10.5,color:"#C62828",background:"#FFF3F3",padding:"0 8px",textAlign:"center"}}>⚠️ Cannot load — set Drive sharing to "Anyone with link"</div>}
      </div>}
    </div>
  );
}

function App(){
  const w=useW();
  const mob=w<640,tab=w<1080;
  const [data,setData]=useState(()=>DEF);
  const [hs,setHs]=useState(0);
  const [cs,setCs]=useState(0);
  const [prod,setProd]=useState(null);
  const [menu,setMenu]=useState(false);
  const [admin,setAdmin]=useState(false);
  const typed=useRef("");

  useEffect(()=>{const fn=e=>e.preventDefault();document.addEventListener("contextmenu",fn);return()=>document.removeEventListener("contextmenu",fn);},[]);
  useEffect(()=>{const t=setInterval(()=>setHs(s=>(s+1)%data.slides.length),5000);return()=>clearInterval(t);},[data.slides.length]);
  useEffect(()=>{const t=setInterval(()=>setCs(s=>(s+1)%data.certs.length),3500);return()=>clearInterval(t);},[data.certs.length]);
  useEffect(()=>{document.body.style.overflow=(prod||admin)?"hidden":"";},[prod,admin]);
  useEffect(()=>{
    const S="adminmode";
    const fn=e=>{
      if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName))return;
      typed.current+=(e.key||"").toLowerCase();
      if(typed.current.length>30)typed.current=typed.current.slice(-20);
      if(typed.current.endsWith(S)){setAdmin(true);typed.current="";}
    };
    window.addEventListener("keydown",fn);
    return()=>window.removeEventListener("keydown",fn);
  },[]);

  const go=useCallback(id=>{document.getElementById(id)?.scrollIntoView({behavior:"smooth"});setMenu(false);},[]);
  const {company:co,about:ab,hero:hr,slides,certs,products,why}=data;
  const pad=mob?"44px 4%":tab?"56px 4%":"76px 5%";
  const sT={fontFamily:"'Playfair Display',serif",fontSize:mob?24:tab?30:40,fontWeight:700,color:N,lineHeight:1.12,marginBottom:13};
  const eye={display:"inline-flex",alignItems:"center",gap:7,fontSize:10,fontWeight:700,color:G,letterSpacing:3,textTransform:"uppercase",marginBottom:11};
  const eyeB={width:20,height:2,background:G,display:"inline-block"};

  const socials=[
    {name:"LinkedIn",href:co.linkedin||"https://www.linkedin.com/company/gunjal-industries-private-ltd/posts/?feedView=all",bg:"#0A66C2",c:W,ico:<I.Lnk/>}
  ];

  const handleBrochure=()=>{
    if(!co.brochure){alert("Brochure not set.\nType 'adminmode' → Company tab → paste PDF URL.");return;}
    const {download}=toBrochureUrls(co.brochure);
    const ext=(co.brochure.split('.').pop()||'pdf').split('?')[0];
    const a=document.createElement('a');a.href=download;a.target="_blank";a.download=`Gunjal_Industries_Brochure.${ext}`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  };

  return(

              </div>
              <div style={{marginBottom:10}}><label style={{display:"block",fontSize:9.5,fontWeight:700,color:"rgba(255,255,255,.5)",letterSpacing:1,textTransform:"uppercase",marginBottom:5}}>Product Category</label>
                <select style={{width:"100%",background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.16)",padding:"10px 12px",color:W,fontSize:13.5,outline:"none"}}>
                  <option style={{background:N}}>— Select —</option>
                  <option style={{background:N}}>Organic & Inorganic Chemicals</option>
                  <option style={{background:N}}>Pharma Intermediates / APIs</option>
                  <option style={{background:N}}>Speciality Chemicals</option>
                  <option style={{background:N}}>Multiple Products</option>
                </select>
              </div>
              <div style={{marginBottom:10}}><label style={{display:"block",fontSize:9.5,fontWeight:700,color:"rgba(255,255,255,.5)",letterSpacing:1,textTransform:"uppercase",marginBottom:5}}>Your Requirement *</label>
                <textarea placeholder="Chemicals needed, quantity, grade, documentation requirements..." style={{width:"100%",background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.16)",padding:"10px 12px",color:W,fontSize:13.5,outline:"none",resize:"vertical",minHeight:88}}/>
              </div>
              <button style={{width:"100%",background:G,color:N,border:"none",padding:14,fontSize:14,fontWeight:800,cursor:"pointer",letterSpacing:1,textTransform:"uppercase",transition:"background .15s"}}
                onMouseEnter={e=>e.currentTarget.style.background="#E8B44A"}
                onMouseLeave={e=>e.currentTarget.style.background=G}>Submit Inquiry →</button>
            </div>
          </div>
        </div>
      </div>

      {/* ── FOOTER ── */}
      <div style={{background:N,borderTop:"2.5px solid "+G}}>
        <div style={{maxWidth:1400,margin:"0 auto",padding:mob?"32px 4% 20px":"48px 5% 30px",display:"grid",gridTemplateColumns:mob?"1fr":tab?"1fr 1fr":"1.8fr 1fr 1.4fr",gap:mob?26:48}}>
          <div>
            <div style={{display:"flex",alignItems:"center",marginBottom:14}}>
              <img src={DL} alt="Gunjal" style={{height:mob?68:84,width:"auto",objectFit:"contain",flexShrink:0,mixBlendMode:"screen"}}/>
              <div style={{marginLeft:12}}>
                <div style={{fontFamily:"'Playfair Display',serif",fontSize:mob?16:20,fontWeight:700,color:W}}>Gunjal Industries Private Limited</div>
                <div style={{fontSize:9.5,color:"rgba(255,255,255,.35)",letterSpacing:1.2,textTransform:"uppercase",marginTop:2}}>Established. 2026 · Ankleshwar, Gujarat</div>
              </div>
            </div>
            <p style={{fontSize:13,color:"rgba(255,255,255,.44)",lineHeight:1.82,maxWidth:248,marginBottom:14}}>Trusted chemical manufacturer from GIDC Ankleshwar, delivering quality chemicals across India and internationally.</p>
            <div style={{fontSize:13,fontStyle:"italic",color:G,opacity:.75,fontFamily:"'Playfair Display',serif",marginBottom:16}}>You Demand, We Deliver.</div>
            <div style={{display:"flex",gap:8}}>
            </div>
          </div>
          <div>
            <h4 style={{fontSize:11,fontWeight:700,color:"#E8B44A",letterSpacing:1.5,textTransform:"uppercase",marginBottom:16}}>Quick Links</h4>
            <div style={{display:"flex",flexDirection:"column",gap:11}}>
              {[["home","Home"],["about","About Us"],["products","Products"],["certifications","Certifications"],["why","Why Choose Us"],["contact","Contact"]].map(([id,l])=>(
                <span key={id} onClick={()=>go(id)} style={{fontSize:14,color:"rgba(255,255,255,.48)",cursor:"pointer",transition:"color .15s"}}
                  onMouseEnter={e=>e.currentTarget.style.color="#E8B44A"}
                  onMouseLeave={e=>e.currentTarget.style.color="rgba(255,255,255,.48)"}>{l}</span>
              ))}
            </div>
          </div>
          <div>
            <h4 style={{fontSize:11,fontWeight:700,color:"#E8B44A",letterSpacing:1.5,textTransform:"uppercase",marginBottom:16}}>Contact Information</h4>
            <div style={{display:"flex",flexDirection:"column",gap:13}}>
              {[[<I.Pin/>,co.address],[<I.Phone/>,co.phone],[<I.Mail/>,co.email]].map(([ico,v],i)=>(
                <div key={i} style={{display:"flex",alignItems:"flex-start",gap:9}}>
                  <span style={{color:"rgba(255,255,255,.44)",marginTop:1,flexShrink:0}}>{ico}</span>
                  <span style={{fontSize:13,color:"rgba(255,255,255,.48)",lineHeight:1.65}}>{v}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
        <div style={{borderTop:"1px solid rgba(255,255,255,.07)",padding:mob?"11px 4%":"14px 5%",display:"flex",flexDirection:mob?"column":"row",alignItems:mob?"flex-start":"center",justifyContent:"space-between",gap:7,maxWidth:1400,margin:"0 auto"}}>
          <p style={{fontSize:11.5,color:"rgba(255,255,255,.28)"}}>© 2026 <strong style={{color:"#E8B44A"}}>{co.name}</strong> All rights reserved. GIDC Ankleshwar, Gujarat, India.</p>
          <span style={{fontSize:11,color:"rgba(255,255,255,.2)"}}>Right-click protected · Images may not be reproduced</span>
        </div>
      </div>

      {/* ── PRODUCT MODAL ── */}
      {prod&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.82)",zIndex:9990,display:"flex",alignItems:"center",justifyContent:"center",padding:mob?8:16,overflowY:"auto"}} onClick={()=>setProd(null)}>
          <div style={{background:W,width:"100%",maxWidth:mob?"100%":960,maxHeight:mob?"96vh":"92vh",display:"flex",flexDirection:mob?"column":"row",position:"relative",overflow:mob?"auto":"hidden",boxShadow:"0 24px 64px rgba(0,0,0,.5)",borderRadius:mob?8:0,marginBlock:mob?"auto":0}} onClick={e=>e.stopPropagation()}>
            <div style={{width:mob?"100%":"40%",padding:mob?"20px 16px":"28px 24px",overflowY:mob?"visible":"auto",flexShrink:0,borderRight:mob?"none":"1px solid "+BD,borderBottom:mob?"1px solid "+BD:"none"}}>
              <div style={{fontSize:9.5,fontWeight:700,color:G,letterSpacing:2,textTransform:"uppercase"}}>Product Details</div>
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:mob?20:24,fontWeight:700,color:N,margin:"10px 0 8px",lineHeight:1.2}}>{prod.name}</h2>
              <span style={{display:"inline-block",background:prod.grade==="Food Grade"?"#E8F5E9":"rgba(11,29,58,.08)",color:prod.grade==="Food Grade"?"#1B5E20":N,fontSize:10.5,fontWeight:700,padding:"3px 10px",letterSpacing:.5,textTransform:"uppercase",marginBottom:16,border:"1px solid "+(prod.grade==="Food Grade"?"rgba(27,94,32,.3)":BD)}}>{prod.grade}</span>
              <div style={{marginBottom:16}}>
                {[["CAS Number",prod.cas],["Grade",prod.grade],["Availability","In Stock"],["Packaging","As Per Requirement"]].map(([l,v])=>(
                  <div key={l} style={{display:"flex",padding:"10px 0",borderBottom:"1px solid "+BD}}>
                    <span style={{fontSize:9.5,fontWeight:700,color:G,letterSpacing:1,textTransform:"uppercase",width:110,flexShrink:0,paddingTop:1}}>{l}</span>
                    <span style={{fontSize:mob?13:14,color:N}}>{v}</span>
                  </div>
                ))}
              </div>
              <p style={{fontSize:mob?13.5:14.5,color:"#6B7280",lineHeight:1.78,marginBottom:20}}>{prod.desc}</p>
              <button onClick={()=>{setProd(null);go("contact");}} style={{width:"100%",background:N,color:W,border:"none",padding:13,fontSize:13.5,fontWeight:700,cursor:"pointer",letterSpacing:.5,textTransform:"uppercase",marginBottom:9}}>Send Inquiry</button>
              <button onClick={()=>setProd(null)} style={{width:"100%",background:"transparent",color:"#9CA3AF",border:"1px solid "+BD,padding:11,fontSize:13,fontWeight:600,cursor:"pointer"}}>Close</button>
            </div>
            <div style={{flex:1,position:"relative",background:CR,minHeight:mob?220:440,height:mob?250:"auto"}}>
              <button onClick={()=>setProd(null)} style={{position:"absolute",top:10,right:10,background:"rgba(0,0,0,.58)",border:"none",color:W,width:36,height:36,borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2}}><I.X/></button>
              <SafeImg src={prod.img} alt={prod.name} fit="contain" style={{width:"100%",height:"100%"}}/>
              <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,.78))",padding:"18px 16px 14px"}}>
                <div style={{fontSize:mob?15:17,fontWeight:700,color:W}}>{prod.name}</div>
                <div style={{fontFamily:"monospace",fontSize:mob?10:11,color:"rgba(255,255,255,.6)",marginTop:3}}>CAS: {prod.cas}</div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ADMIN PANEL — outside App, no blinking */}
      {admin&&<AdminPanel data={data} setData={setData} setAdmin={setAdmin} mob={mob}/>}

    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body></html>
